# XenonRecomp config for NFS: Undercover (Xbox 360, USA, En/Fr/Es)
# default.xex SHA-256 97ac0c072253d46458dc6d57c6609922adbd3b9658216940282c361ad575e221
# Paths are relative to this file. Needs XenonRecomp with patches 0001-0014 and 0019 (0014: a dropped branch is FATAL; 0019: bdzlr/bdnzlr don't end a function).
#
# Regenerate the generated blocks and switch tables (from the repo root):
#   tools/XenonRecomp/build/XenonAnalyse/XenonAnalyse game-undercover/files/default.xex game-undercover/survey/switch_tables.raw.toml
#   SB_GAME=undercover python3 survey/fix_switch_tables.py
#   (recompile, then) SB_GAME=undercover python3 survey/find_missing_tables.py > config/undercover/switch_tables_inline.toml
#   SB_GAME=undercover python3 survey/fix_switch_tables.py
#   SB_GAME=undercover python3 survey/leaf_switch_bounds.py --write
#   SB_GAME=undercover python3 survey/eh_data_ranges.py --write
#   (recompile, then) SB_GAME=undercover python3 survey/find_entry_points.py --write

[main]
file_path = "../../game-undercover/files/default.xex"
out_directory_path = "../../ppc-undercover"
switch_table_file_path = "switch_tables.toml"

# Optimizations stay off until the recompilation runs correctly.
skip_lr = false
skip_msr = false
ctr_as_local = false
xer_as_local = false
reserved_as_local = false
cr_as_local = false
non_argument_as_local = false
non_volatile_as_local = false

# Found by survey/xexsurvey.cpp byte patterns (one hit each): the same XDK
# CRT layout as Most Wanted's, Carbon's and ProStreet's (restgpr = savegpr + 0x50,
# vmx_64 = vmx_14 + 0x94).
restgprlr_14_address = 0x82D326B0
savegprlr_14_address = 0x82D32660
restfpr_14_address = 0x82D3336C
savefpr_14_address = 0x82D33320
restvmx_14_address = 0x82D32A68
savevmx_14_address = 0x82D327D0
restvmx_64_address = 0x82D32AFC
savevmx_64_address = 0x82D32864

# setjmp/longjmp: ProStreet's first 20 instructions (immediates masked),
# one hit each in the image, as ProStreet's.
longjmp_address = 0x82D33550
setjmp_address = 0x82D33B70

invalid_instructions = [
    { data = 0x00000000, size = 4 }, # Padding
]

